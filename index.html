<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify Landing Page</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 1200px;
        }
        .product {
            margin: 40px auto;
            perspective: 1000px;
        }
        .product img {
            width: 300px;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .product img:hover {
            transform: rotateY(15deg) rotateX(15deg) scale(1.05);
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #fff;
            color: #000;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Shopify Store</h1>
        <p>Experience minimalist design with futuristic flair.</p>
        <div class="product">
            <img src="https://via.placeholder.com/300" alt="Product">
        </div>
        <a class="btn" href="#">Shop Now</a>
    </div>
</body>
</html>
